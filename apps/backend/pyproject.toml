[project]
name = "terratrain-backend"
version = "0.1.0"
description = "TerraTrain AI coaching backend"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.1",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",

    # Data processing (no pandas)
    "polars>=1.15",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "numpy>=2.2",

    # LLM / RAG
    "llama-index-core>=0.12",
    "llama-index-vector-stores-postgres>=0.3",
    "llama-index-embeddings-ollama>=0.3",
    "llama-index-llms-ollama>=0.4",
    "llama-index-readers-file>=0.3",

    # GPS
    "gpxpy>=1.6",

    # HTTP client
    "httpx>=0.28",
    "tenacity>=9",

    # Security / encryption
    "cryptography>=44",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "slowapi>=0.1",

    # Observability
    "structlog>=24",
    "rich>=13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6",
    "anyio>=4",
    "ruff>=0.9",
    "mypy>=1.14",
    "factory-boy>=3.3",
    "respx>=0.21",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terratrain"]
