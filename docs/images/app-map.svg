<svg width="1100" height="520" viewBox="0 0 1100 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0d0e"/>
      <stop offset="100%" stop-color="#121417"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#343a42"/>
    </marker>
  </defs>
  <rect width="1100" height="520" fill="url(#bg2)"/>

  <!-- center: Connect -->
  <g transform="translate(470,20)">
    <rect width="160" height="70" rx="14" fill="#16181b" stroke="#a3e635" stroke-width="1.5"/>
    <text x="80" y="30" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="700" fill="#edf1ee">/connect</text>
    <text x="80" y="50" text-anchor="middle" font-family="Helvetica" font-size="10.5" fill="#a3aba5">Intervals.icu verbinden</text>
  </g>

  <!-- connector down to dashboard -->
  <line x1="550" y1="90" x2="550" y2="150" stroke="#343a42" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Dashboard hub -->
  <g transform="translate(430,150)">
    <rect width="240" height="80" rx="16" fill="#1e2126" stroke="#262a30" stroke-width="1.5"/>
    <circle cx="30" cy="40" r="14" fill="#101401" stroke="#a3e635" stroke-width="1.5"/>
    <rect x="24" y="34" width="4" height="12" fill="#a3e635"/>
    <rect x="30" y="30" width="4" height="16" fill="#a3e635"/>
    <rect x="36" y="26" width="4" height="20" fill="#a3e635"/>
    <text x="58" y="36" font-family="Helvetica" font-size="14" font-weight="700" fill="#edf1ee">Dashboard</text>
    <text x="58" y="54" font-family="Helvetica" font-size="10.5" fill="#a3aba5">FTP · CTL/ATL/TSB · PMC-Chart</text>
  </g>

  <!-- spokes to the 5 sections -->
  <line x1="470" y1="230" x2="150" y2="330" stroke="#343a42" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="230" x2="360" y2="330" stroke="#343a42" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="230" x2="570" y2="330" stroke="#343a42" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="230" x2="780" y2="330" stroke="#343a42" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="230" x2="980" y2="330" stroke="#343a42" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Coach -->
  <g transform="translate(50,330)">
    <rect width="200" height="150" rx="14" fill="#16181b" stroke="#262a30" stroke-width="1.5"/>
    <circle cx="34" cy="34" r="14" fill="#a3e635" opacity="0.15"/>
    <circle cx="34" cy="34" r="6" fill="#a3e635"/>
    <text x="60" y="30" font-family="Helvetica" font-size="13.5" font-weight="700" fill="#edf1ee">Coach</text>
    <text x="60" y="46" font-family="Helvetica" font-size="10" fill="#a3aba5">KI-Workout erstellen</text>
    <rect x="16" y="66" width="168" height="16" rx="4" fill="#c98500" opacity="0.85"/>
    <text x="24" y="77" font-family="Helvetica" font-size="9" fill="#0b0d0e" font-weight="700">Z4 · 96% FTP</text>
    <rect x="16" y="88" width="90" height="16" rx="4" fill="#7189c9" opacity="0.85"/>
    <rect x="16" y="110" width="140" height="16" rx="4" fill="#199e70" opacity="0.85"/>
    <text x="16" y="140" font-family="Helvetica" font-size="9.5" fill="#697069">→ Push zu Intervals.icu</text>
  </g>

  <!-- Routes -->
  <g transform="translate(270,330)">
    <rect width="200" height="150" rx="14" fill="#16181b" stroke="#262a30" stroke-width="1.5"/>
    <circle cx="34" cy="34" r="14" fill="#3987e5" opacity="0.15"/>
    <path d="M28,40 L32,28 L38,36 L42,26" stroke="#3987e5" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="60" y="30" font-family="Helvetica" font-size="13.5" font-weight="700" fill="#edf1ee">Routen</text>
    <text x="60" y="46" font-family="Helvetica" font-size="10" fill="#a3aba5">GPX hochladen</text>
    <path d="M20,130 C50,120 70,90 100,100 C130,110 150,70 180,66" stroke="#65a30d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="16" y="140" font-family="Helvetica" font-size="9.5" fill="#697069">Anstiege automatisch erkannt</text>
  </g>

  <!-- Workouts -->
  <g transform="translate(490,330)">
    <rect width="200" height="150" rx="14" fill="#16181b" stroke="#262a30" stroke-width="1.5"/>
    <circle cx="34" cy="34" r="14" fill="#d55181" opacity="0.15"/>
    <rect x="26" y="27" width="16" height="16" rx="3" fill="#d55181"/>
    <text x="60" y="30" font-family="Helvetica" font-size="13.5" font-weight="700" fill="#edf1ee">Workouts</text>
    <text x="60" y="46" font-family="Helvetica" font-size="10" fill="#a3aba5">Alle Pläne verwalten</text>
    <rect x="16" y="66" width="168" height="20" rx="5" fill="#1e2126"/>
    <text x="24" y="80" font-family="Helvetica" font-size="9.5" fill="#a3aba5">Entwurf</text>
    <rect x="16" y="92" width="168" height="20" rx="5" fill="#1e2126"/>
    <text x="24" y="106" font-family="Helvetica" font-size="9.5" fill="#34d399">Gesendet</text>
    <rect x="16" y="118" width="168" height="20" rx="5" fill="#1e2126"/>
    <text x="24" y="132" font-family="Helvetica" font-size="9.5" fill="#a3aba5">Abgeschlossen</text>
  </g>

  <!-- Knowledge -->
  <g transform="translate(710,330)">
    <rect width="200" height="150" rx="14" fill="#16181b" stroke="#262a30" stroke-width="1.5"/>
    <circle cx="34" cy="34" r="14" fill="#c98500" opacity="0.15"/>
    <rect x="27" y="26" width="14" height="18" rx="2" fill="#c98500"/>
    <text x="60" y="30" font-family="Helvetica" font-size="13.5" font-weight="700" fill="#edf1ee">Wissen</text>
    <text x="60" y="46" font-family="Helvetica" font-size="10" fill="#a3aba5">RAG-Wissensbasis</text>
    <rect x="16" y="66" width="168" height="48" rx="8" fill="none" stroke="#343a42" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="100" y="94" text-anchor="middle" font-family="Helvetica" font-size="9.5" fill="#697069">PDF hierher ziehen</text>
    <text x="16" y="132" font-family="Helvetica" font-size="9.5" fill="#697069">→ fundiertere Trainingspläne</text>
  </g>

  <!-- Settings -->
  <g transform="translate(930,330)">
    <rect width="120" height="150" rx="14" fill="#16181b" stroke="#262a30" stroke-width="1.5"/>
    <circle cx="34" cy="34" r="14" fill="#a3aba5" opacity="0.15"/>
    <circle cx="34" cy="34" r="7" fill="none" stroke="#a3aba5" stroke-width="2"/>
    <circle cx="34" cy="34" r="2.5" fill="#a3aba5"/>
    <text x="58" y="30" font-family="Helvetica" font-size="12.5" font-weight="700" fill="#edf1ee">Einstel-</text>
    <text x="58" y="44" font-family="Helvetica" font-size="12.5" font-weight="700" fill="#edf1ee">lungen</text>
    <text x="16" y="90" font-family="Helvetica" font-size="9" fill="#697069">Profil</text>
    <text x="16" y="106" font-family="Helvetica" font-size="9" fill="#697069">API-Key</text>
    <text x="16" y="122" font-family="Helvetica" font-size="9" fill="#697069">Sprache</text>
    <text x="16" y="138" font-family="Helvetica" font-size="9" fill="#e66767">Trennen</text>
  </g>
</svg>
