<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0d0e"/>
      <stop offset="100%" stop-color="#14161a"/>
    </linearGradient>
    <linearGradient id="mountain1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2126"/>
      <stop offset="100%" stop-color="#16181b"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262a30"/>
      <stop offset="100%" stop-color="#1a1c20"/>
    </linearGradient>
    <linearGradient id="routeGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- back ridge -->
  <path d="M0,300 L140,190 L260,250 L400,150 L560,240 L720,170 L900,260 L1050,190 L1200,240 L1200,360 L0,360 Z"
        fill="url(#mountain2)"/>

  <!-- front ridge -->
  <path d="M0,340 L180,220 L320,290 L480,180 L620,270 L800,190 L960,280 L1120,210 L1200,250 L1200,360 L0,360 Z"
        fill="url(#mountain1)"/>

  <!-- hairline contour on front ridge -->
  <path d="M0,340 L180,220 L320,290 L480,180 L620,270 L800,190 L960,280 L1120,210 L1200,250"
        fill="none" stroke="#343a42" stroke-width="1.5"/>

  <!-- climb route line tracing up the main peak -->
  <path d="M60,332 C160,300 220,260 260,232 C300,204 340,196 380,182 C420,168 450,150 480,182"
        fill="none" stroke="url(#routeGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="60" cy="332" r="5" fill="#a3e635"/>
  <circle cx="480" cy="182" r="7" fill="#a3e635"/>
  <circle cx="480" cy="182" r="12" fill="none" stroke="#a3e635" stroke-width="1.5" opacity="0.5"/>

  <!-- climb segment markers (zone-colored ticks along the route) -->
  <circle cx="150" cy="303" r="3.5" fill="#3987e5"/>
  <circle cx="270" cy="228" r="3.5" fill="#199e70"/>
  <circle cx="360" cy="190" r="3.5" fill="#c98500"/>
  <circle cx="440" cy="163" r="3.5" fill="#d95926"/>

  <!-- AI node at the summit -->
  <g transform="translate(480,182)">
    <circle r="26" fill="#101401" stroke="#a3e635" stroke-width="1.5" opacity="0.9"/>
    <path d="M-8,-2 a8,8 0 1,1 8,8 M-8,-2 a8,8 0 1,0 8,8" stroke="#a3e635" stroke-width="2" fill="none" transform="scale(0.9)"/>
    <circle cx="0" cy="0" r="3" fill="#a3e635"/>
  </g>

  <!-- power-zone bars, bottom right (echoes the coach's phase bars) -->
  <g transform="translate(900,300)">
    <rect x="0"  y="18" width="26" height="10" rx="2" fill="#7189c9"/>
    <rect x="30" y="12" width="26" height="16" rx="2" fill="#3987e5"/>
    <rect x="60" y="4"  width="26" height="24" rx="2" fill="#199e70"/>
    <rect x="90" y="-10" width="26" height="38" rx="2" fill="#c98500"/>
    <rect x="120" y="8" width="26" height="20" rx="2" fill="#d95926"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(60,64)">
    <circle cx="0" cy="0" r="7" fill="#a3e635"/>
    <text x="20" y="7" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#edf1ee">TerraTrain</text>
    <text x="20" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#a3aba5">AI-Coaching, abgestimmt auf dein Terrain</text>
  </g>
</svg>
